[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geognn-graph-flashback"
version = "0.3.0"
description = "Reproducible STKG, TransE and Graph-Flashback pipeline for Gowalla and Foursquare"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4", "pyarrow>=15,<25", "torch>=2.2,<3"
]

[tool.setuptools.packages.find]
include = ["flashback*"]
