profiles:
  core:
  - tuned_full_seed42
  - tuned_no_kge_graphs
  - tuned_transition_only
  - tuned_preference_only
  - faithful_rank
  full:
  - tuned_full_seed42
  - tuned_full_seed7
  - tuned_full_seed2026
  - tuned_no_kge_graphs
  - tuned_transition_only
  - tuned_preference_only
  - tuned_no_priors
  - tuned_no_bpr
  - tuned_rank_scheme
  - faithful_rank
groups:
  tuned_radius:
    base_config: configs/austin_tuned.yaml
  tuned_rank:
    base_config: configs/austin_tuned_rank.yaml
  faithful_rank:
    base_config: configs/austin_faithful.yaml
experiments:
  tuned_full_seed42:
    group: tuned_radius
    label: Enhanced Graph-Flashback (seed 42)
    seed_group: tuned_full
    overrides: {}
  tuned_full_seed7:
    group: tuned_radius
    label: Enhanced Graph-Flashback (seed 7)
    seed_group: tuned_full
    overrides:
      train:
        seed: 7
  tuned_full_seed2026:
    group: tuned_radius
    label: Enhanced Graph-Flashback (seed 2026)
    seed_group: tuned_full
    overrides:
      train:
        seed: 2026
  tuned_no_kge_graphs:
    group: tuned_radius
    label: Enhanced Flashback without KGE graphs
    overrides:
      model:
        use_transition_graph: false
        use_preference_graph: false
        graph_layers: 0
  tuned_transition_only:
    group: tuned_radius
    label: Enhanced Flashback + transition graph
    overrides:
      model:
        use_transition_graph: true
        use_preference_graph: false
  tuned_preference_only:
    group: tuned_radius
    label: Enhanced Flashback + preference graph
    overrides:
      model:
        use_transition_graph: false
        use_preference_graph: true
        graph_layers: 0
  tuned_no_priors:
    group: tuned_radius
    label: Graph-Flashback without ranking priors
    overrides:
      model:
        personal_prior_weight: 0.0
        recent_prior_weight: 0.0
        global_prior_weight: 0.0
        geo_prior_weight: 0.0
        category_transition_weight: 0.0
        learnable_prior_weights: false
        use_repeat_gate: false
      train:
        repeat_gate_weight: 0.0
  tuned_no_bpr:
    group: tuned_radius
    label: Enhanced Graph-Flashback without BPR
    overrides:
      train:
        bpr_weight: 0.0
  tuned_rank_scheme:
    group: tuned_rank
    label: Enhanced Graph-Flashback with rank-based STKG
    overrides: {}
  faithful_rank:
    group: faithful_rank
    label: Faithful Austin Graph-Flashback (rank STKG)
    overrides: {}
published_reference:
  Flashback (paper, full Gowalla):
    Acc@1: 0.1158
    Acc@5: 0.2754
    Acc@10: 0.3479
    MRR: 0.1925
  Graph-Flashback (paper, full Gowalla):
    Acc@1: 0.1512
    Acc@5: 0.3425
    Acc@10: 0.4256
    MRR: 0.2422
