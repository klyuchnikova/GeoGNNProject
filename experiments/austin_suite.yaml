# Clean Austin-only experiment plan, inspired by the tidy GUGEN sweep style.
# Profiles:
#   core          — compact report-ready ablations on one common Austin split.
#   full          — core + three seeds + cell/friendship/filter/original-like checks.
#   filter_sweep  — only filtration sensitivity experiments.
#   cells         — only RNN/GRU/LSTM comparison.
#   graph_ablation — only KGE graph ablation.
profiles:
  core:
    - tuned_full_seed42
    - tuned_no_kge_graphs
    - tuned_transition_only
    - tuned_preference_only
    - tuned_with_friendship
    - faithful_rank
  full:
    - tuned_full_seed42
    - tuned_full_seed7
    - tuned_full_seed2026
    - tuned_no_kge_graphs
    - tuned_transition_only
    - tuned_preference_only
    - tuned_no_priors
    - tuned_rank_scheme
    - tuned_with_friendship
    - tuned_lstm
    - tuned_rnn
    - filter_min20_20
    - filter_kcore20_20
    - filter_combined10_10
    - faithful_rank
  filter_sweep:
    - filter_no_filter_2_2
    - filter_min10_10
    - filter_min20_20
    - filter_kcore10_10
    - filter_kcore20_20
    - filter_combined10_10
    - filter_kcore30_20
    - tuned_full_seed42
  cells:
    - tuned_full_seed42
    - tuned_lstm
    - tuned_rnn
  graph_ablation:
    - tuned_full_seed42
    - tuned_no_kge_graphs
    - tuned_transition_only
    - tuned_preference_only
    - tuned_rank_scheme
    - tuned_with_friendship
  original_like:
    - faithful_rank
    - faithful_gru
    - faithful_lstm

groups:
  tuned_default:
    base_config: configs/austin_tuned.yaml
    overrides: {}
  tuned_rank:
    base_config: configs/austin_tuned_rank.yaml
    overrides: {}
  tuned_friendship:
    base_config: configs/austin_tuned_rank.yaml
    overrides:
      data:
        raw_friendships: data/input/gowalla_austin_friendships.csv.gz
        output_dir: runs/shared/tuned_friendship/processed
      stkg:
        include_friendship: true
        output_dir: runs/shared/tuned_friendship/kge
      kge:
        checkpoint: runs/shared/tuned_friendship/kge/transe_best.pt
        relation_weights:
          visits: 0.35
          temporal: 0.35
          spatial: 0.20
          friend: 0.10
      graphs:
        output_dir: runs/shared/tuned_friendship/graphs
      model:
        use_friend_graph: true
  filter_no_filter_2_2:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: min_only
        min_checkins: 2
        min_poi_visits: 2
        output_dir: runs/shared/filter_no_filter_2_2/processed
      stkg:
        output_dir: runs/shared/filter_no_filter_2_2/kge
      kge:
        checkpoint: runs/shared/filter_no_filter_2_2/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_no_filter_2_2/graphs
  filter_min10_10:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: min_only
        min_checkins: 10
        min_poi_visits: 10
        output_dir: runs/shared/filter_min10_10/processed
      stkg:
        output_dir: runs/shared/filter_min10_10/kge
      kge:
        checkpoint: runs/shared/filter_min10_10/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_min10_10/graphs
  filter_min20_20:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: min_only
        min_checkins: 20
        min_poi_visits: 20
        output_dir: runs/shared/filter_min20_20/processed
      stkg:
        output_dir: runs/shared/filter_min20_20/kge
      kge:
        checkpoint: runs/shared/filter_min20_20/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_min20_20/graphs
  filter_kcore10_10:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: iterative_kcore
        min_checkins: 10
        min_poi_visits: 10
        user_k: 10
        poi_k: 10
        output_dir: runs/shared/filter_kcore10_10/processed
      stkg:
        output_dir: runs/shared/filter_kcore10_10/kge
      kge:
        checkpoint: runs/shared/filter_kcore10_10/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_kcore10_10/graphs
  filter_kcore20_20:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: iterative_kcore
        min_checkins: 20
        min_poi_visits: 20
        user_k: 20
        poi_k: 20
        output_dir: runs/shared/filter_kcore20_20/processed
      stkg:
        output_dir: runs/shared/filter_kcore20_20/kge
      kge:
        checkpoint: runs/shared/filter_kcore20_20/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_kcore20_20/graphs
  filter_combined10_10:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: combined
        min_checkins: 10
        min_poi_visits: 10
        user_k: 10
        poi_k: 10
        output_dir: runs/shared/filter_combined10_10/processed
      stkg:
        output_dir: runs/shared/filter_combined10_10/kge
      kge:
        checkpoint: runs/shared/filter_combined10_10/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_combined10_10/graphs
  filter_kcore30_20:
    base_config: configs/austin_tuned.yaml
    overrides:
      data:
        filter_mode: iterative_kcore
        min_checkins: 30
        min_poi_visits: 20
        user_k: 30
        poi_k: 20
        output_dir: runs/shared/filter_kcore30_20/processed
      stkg:
        output_dir: runs/shared/filter_kcore30_20/kge
      kge:
        checkpoint: runs/shared/filter_kcore30_20/kge/transe_best.pt
      graphs:
        output_dir: runs/shared/filter_kcore30_20/graphs
  faithful_rank:
    base_config: configs/austin_faithful.yaml
    overrides: {}

experiments:
  tuned_full_seed42:
    group: tuned_default
    label: Enhanced Graph-Flashback, common split, seed 42
    seed_group: tuned_full_common
    family: common_protocol
    overrides: {}
  tuned_full_seed7:
    group: tuned_default
    label: Enhanced Graph-Flashback, common split, seed 7
    seed_group: tuned_full_common
    family: common_protocol
    overrides:
      train:
        seed: 7
  tuned_full_seed2026:
    group: tuned_default
    label: Enhanced Graph-Flashback, common split, seed 2026
    seed_group: tuned_full_common
    family: common_protocol
    overrides:
      train:
        seed: 2026
  tuned_no_kge_graphs:
    group: tuned_default
    label: Enhanced Flashback without KGE graphs
    family: common_protocol
    overrides:
      model:
        use_transition_graph: false
        use_preference_graph: false
        graph_layers: 0
  tuned_transition_only:
    group: tuned_default
    label: Enhanced Flashback + transition graph only
    family: common_protocol
    overrides:
      model:
        use_transition_graph: true
        use_preference_graph: false
  tuned_preference_only:
    group: tuned_default
    label: Enhanced Flashback + preference graph only
    family: common_protocol
    overrides:
      model:
        use_transition_graph: false
        use_preference_graph: true
        graph_layers: 0
  tuned_no_priors:
    group: tuned_default
    label: Graph-Flashback without ranking priors
    family: common_protocol
    overrides:
      model:
        personal_prior_weight: 0.0
        recent_prior_weight: 0.0
        global_prior_weight: 0.0
        geo_prior_weight: 0.0
        category_transition_weight: 0.0
        learnable_prior_weights: false
        use_repeat_gate: false
      train:
        repeat_gate_weight: 0.0
  tuned_rank_scheme:
    group: tuned_rank
    label: Enhanced Graph-Flashback with rank-based STKG
    family: common_protocol
    overrides: {}
  tuned_with_friendship:
    group: tuned_friendship
    label: Enhanced Graph-Flashback with friendship graph
    family: common_protocol
    overrides: {}
  tuned_lstm:
    group: tuned_default
    label: Enhanced Graph-Flashback, LSTM cell
    family: cell_sweep
    overrides:
      model:
        rnn: lstm
  tuned_rnn:
    group: tuned_default
    label: Enhanced Graph-Flashback, vanilla RNN cell
    family: cell_sweep
    overrides:
      model:
        rnn: rnn
  filter_no_filter_2_2:
    group: filter_no_filter_2_2
    label: "Filter sweep: min-only 2/2"
    family: filter_sweep
    overrides: {}
  filter_min10_10:
    group: filter_min10_10
    label: "Filter sweep: min-only 10/10"
    family: filter_sweep
    overrides: {}
  filter_min20_20:
    group: filter_min20_20
    label: "Filter sweep: min-only 20/20"
    family: filter_sweep
    overrides: {}
  filter_kcore10_10:
    group: filter_kcore10_10
    label: "Filter sweep: iterative k-core 10/10"
    family: filter_sweep
    overrides: {}
  filter_kcore20_20:
    group: filter_kcore20_20
    label: "Filter sweep: iterative k-core 20/20"
    family: filter_sweep
    overrides: {}
  filter_combined10_10:
    group: filter_combined10_10
    label: "Filter sweep: min 10/10 + k-core 10/10"
    family: filter_sweep
    overrides: {}
  filter_kcore30_20:
    group: filter_kcore30_20
    label: "Filter sweep: iterative k-core 30/20"
    family: filter_sweep
    overrides: {}
  faithful_gru:
    group: faithful_rank
    label: Original-like Austin Graph-Flashback, GRU cell
    family: original_like
    overrides:
      model:
        rnn: gru
  faithful_lstm:
    group: faithful_rank
    label: Original-like Austin Graph-Flashback, LSTM cell
    family: original_like
    overrides:
      model:
        rnn: lstm
  faithful_rank:
    group: faithful_rank
    label: Original-like Austin Graph-Flashback, rank STKG
    family: original_like
    overrides: {}

published_reference:
  Flashback (paper, full Gowalla):
    Acc@1: 0.1158
    Acc@5: 0.2754
    Acc@10: 0.3479
    MRR: 0.1925
  Graph-Flashback (paper, full Gowalla):
    Acc@1: 0.1512
    Acc@5: 0.3425
    Acc@10: 0.4256
    MRR: 0.2422
