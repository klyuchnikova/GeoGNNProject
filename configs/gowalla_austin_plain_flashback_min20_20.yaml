data:
  dataset: gowalla
  input_format: canonical_csv
  preselected_city: true
  raw_checkins: data/input/gowalla_austin_checkins.csv.gz
  raw_friendships: null
  raw_metadata: null
  city: austin
  candidate_cities: []
  filter_mode: min_only
  min_checkins: 20
  min_poi_visits: 20
  user_k: 20
  poi_k: 20
  sequence_length: 20
  sequence_stride: 1
  sequence_mode: window_last
  split_mode: robust
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  output_dir: runs/shared/austin_min20_20/processed
stkg:
  spatial_mode: radius
  spatial_topk: 50
  spatial_radius_km: 3.0
  spatial_symmetric: true
  include_friendship: false
  output_dir: runs/shared/austin_min20_20/kge
kge:
  embedding_dim: 100
  margin: 1.0
  p_norm: 1
  learning_rate: 0.001
  batch_size: 4096
  epochs: 75
  negative_samples: 4
  patience: 12
  sampling: relation_balanced
  relation_weights:
    visits: 0.4
    temporal: 0.4
    spatial: 0.2
    friend: 0.0
  checkpoint: runs/shared/austin_min20_20/kge/transe_best.pt
  device: auto
graphs:
  transition_topk: 100
  user_poi_topk: 100
  score_chunk_size: 1024
  minimum_score: 0.0
  row_relative_scores: true
  output_dir: runs/shared/austin_min20_20/graphs
model:
  rnn: gru
  hidden_dim: 128
  lambda_t: 0.1
  lambda_s: 0.2
  learnable_decay: true
  lambda_loc: 1.0
  use_transition_graph: false
  use_preference_graph: false
  use_spatial_graph: false
  use_friend_graph: false
  graph_weight_projection: false
  graph_layers: 0
  graph_include_initial: true
  coordinate_distance: haversine_km
  use_category_embedding: false
  use_time_embedding: false
  use_user_context: false
  personal_prior_weight: 0.0
  recent_prior_weight: 0.0
  global_prior_weight: 0.0
  geo_prior_weight: 0.0
  category_transition_weight: 0.0
  dynamic_graph_prior_weight: 0.0
  transition_graph_prior_weight: 0.0
  personal_prior_topk: 200
  dynamic_graph_prior_topk: 100
  recent_prior_tau: 5.0
  geo_prior_scale_km: 5.0
  learnable_prior_weights: false
  use_repeat_gate: false
  bounded_residual_scale: 0.0
  dropout: 0.2
train:
  batch_size: 256
  epochs: 60
  learning_rate: 0.001
  weight_decay: 1.0e-05
  gradient_clip: 5.0
  label_smoothing: 0.02
  bpr_weight: 0.0
  repeat_gate_weight: 0.0
  hard_negatives: 16
  patience: 12
  seed: 42
  device: auto
  checkpoint_dir: runs/experiments/plain_flashback_min20_20/checkpoints
  run_name: plain_flashback_min20_20
  checkpoint_metric: MRR
  checkpoint_mode: max
  scheduler_milestones:
  - 20
  - 40
  - 50
  scheduler_gamma: 0.3
  evaluate_test_after_training: true
artifacts_dir: runs/experiments/plain_flashback_min20_20/artifacts
