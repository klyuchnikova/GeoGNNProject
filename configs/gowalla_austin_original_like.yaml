data:
  dataset: gowalla
  input_format: canonical_csv
  preselected_city: true
  raw_checkins: data/input/gowalla_austin_checkins.csv.gz
  raw_friendships: data/input/gowalla_austin_friendships.csv.gz
  raw_metadata: null
  city: austin
  candidate_cities: []
  filter_mode: min_only
  min_checkins: 101
  min_poi_visits: 1
  user_k: 101
  poi_k: 1
  sequence_length: 20
  sequence_stride: 20
  sequence_mode: block_all
  split_mode: paper
  train_ratio: 0.8
  val_ratio: 0.0
  test_ratio: 0.2
  output_dir: runs/shared/austin_original_like/processed
stkg:
  spatial_mode: rank
  spatial_topk: 50
  spatial_radius_km: 3.0
  spatial_symmetric: true
  include_friendship: true
  output_dir: runs/shared/austin_original_like/kge
kge:
  embedding_dim: 100
  margin: 1.0
  p_norm: 1
  learning_rate: 0.001
  batch_size: 4096
  epochs: 100
  negative_samples: 1
  patience: 15
  sampling: natural
  relation_weights:
    visits: 0.35
    temporal: 0.35
    spatial: 0.2
    friend: 0.1
  checkpoint: runs/shared/austin_original_like/kge/transe_best.pt
  device: auto
graphs:
  transition_topk: 100
  user_poi_topk: 100
  score_chunk_size: 1024
  minimum_score: 0.0
  row_relative_scores: false
  output_dir: runs/shared/austin_original_like/graphs
model:
  rnn: rnn
  hidden_dim: 10
  lambda_t: 0.1
  lambda_s: 1000.0
  learnable_decay: false
  lambda_loc: 1.0
  use_transition_graph: true
  use_preference_graph: true
  use_spatial_graph: false
  use_friend_graph: false
  graph_weight_projection: false
  graph_layers: 1
  graph_include_initial: false
  coordinate_distance: euclidean_degrees
  use_category_embedding: false
  use_time_embedding: false
  use_user_context: false
  personal_prior_weight: 0.0
  recent_prior_weight: 0.0
  global_prior_weight: 0.0
  geo_prior_weight: 0.0
  category_transition_weight: 0.0
  dynamic_graph_prior_weight: 0.0
  transition_graph_prior_weight: 0.0
  personal_prior_topk: 200
  dynamic_graph_prior_topk: 100
  recent_prior_tau: 5.0
  geo_prior_scale_km: 5.0
  learnable_prior_weights: false
  use_repeat_gate: false
  bounded_residual_scale: 0.0
  dropout: 0.0
train:
  batch_size: 200
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0
  gradient_clip: 5.0
  label_smoothing: 0.0
  bpr_weight: 0.0
  repeat_gate_weight: 0.0
  hard_negatives: 16
  patience: 20
  seed: 42
  device: auto
  checkpoint_dir: runs/experiments/original_like_graph_flashback/checkpoints
  run_name: original_like_graph_flashback
  checkpoint_metric: MRR
  checkpoint_mode: max
  scheduler_milestones:
  - 20
  - 40
  - 60
  - 80
  scheduler_gamma: 0.3
  evaluate_test_after_training: true
artifacts_dir: runs/experiments/original_like_graph_flashback/artifacts
