data:
  dataset: gowalla
  input_format: canonical_csv
  preselected_city: true
  raw_checkins: data/input/gowalla_austin_checkins.csv.gz
  raw_friendships: null
  raw_metadata: null
  city: austin
  candidate_cities: []
  min_checkins: 30
  min_poi_visits: 10
  sequence_length: 20
  sequence_stride: 1
  sequence_mode: window_last
  split_mode: robust
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  output_dir: data/processed

stkg:
  spatial_mode: radius
  spatial_topk: 50
  spatial_radius_km: 3.0
  spatial_symmetric: true
  include_friendship: false
  output_dir: data/kge

kge:
  embedding_dim: 100
  margin: 1.0
  p_norm: 1
  learning_rate: 0.001
  batch_size: 4096
  epochs: 75
  negative_samples: 4
  patience: 12
  sampling: relation_balanced
  relation_weights:
    visits: 0.40
    temporal: 0.40
    spatial: 0.20
    friend: 0.00
  checkpoint: data/kge/transe_best.pt
  device: auto

graphs:
  transition_topk: 100
  user_poi_topk: 100
  score_chunk_size: 1024
  minimum_score: 0.0
  row_relative_scores: true
  output_dir: data/graphs

model:
  rnn: gru
  hidden_dim: 128
  lambda_t: 0.1
  lambda_s: 0.2
  learnable_decay: true
  lambda_loc: 1.0
  use_transition_graph: true
  use_preference_graph: true
  use_spatial_graph: false
  use_friend_graph: false
  graph_weight_projection: false
  graph_layers: 2
  graph_include_initial: true
  coordinate_distance: haversine_km
  use_category_embedding: true
  use_time_embedding: true
  use_user_context: true
  personal_prior_weight: 2.0
  recent_prior_weight: 1.0
  global_prior_weight: 0.25
  geo_prior_weight: 1.0
  category_transition_weight: 0.5
  personal_prior_topk: 200
  recent_prior_tau: 5.0
  geo_prior_scale_km: 5.0
  learnable_prior_weights: true
  use_repeat_gate: true
  bounded_residual_scale: 0.0
  dropout: 0.2

train:
  batch_size: 256
  epochs: 60
  learning_rate: 0.001
  weight_decay: 1.0e-5
  gradient_clip: 5.0
  label_smoothing: 0.02
  bpr_weight: 0.2
  repeat_gate_weight: 0.1
  hard_negatives: 16
  patience: 12
  seed: 42
  device: auto
  checkpoint_dir: checkpoints
  run_name: gowalla_tuned_graph_flashback
  checkpoint_metric: MRR
  checkpoint_mode: max
  scheduler_milestones: [20, 40, 50]
  scheduler_gamma: 0.3

artifacts_dir: artifacts
